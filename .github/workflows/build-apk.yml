name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_TAG: v0.7.69   # ics-openvpn release the app is built on

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig ninja-build

      - name: Get OpenVPN engine (ics-openvpn ${{ env.ENGINE_TAG }})
        run: |
          git clone --branch "$ENGINE_TAG" --depth 1 https://github.com/schwabe/ics-openvpn.git engine
          cd engine
          git submodule update --init --recursive --jobs 4

      - name: Add SRK VPN to the engine
        run: bash scripts/patch-engine.sh engine

      - name: Android SDK licences and signing key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "sdk.dir=$SDK" > engine/local.properties
          mkdir -p ~/.android
          cp signing/srk-vpn-debug.keystore ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        working-directory: engine
        run: ./gradlew :main:assembleSkeletonOvpn2Release -PicsopenvpnDebugSign --stacktrace

      - name: Collect APK
        run: |
          APK=$(find engine/main/build/outputs/apk -name '*.apk' | grep -i release | head -1)
          echo "Built: $APK"
          cp "$APK" SRK-VPN.apk
          ls -la SRK-VPN.apk

      - uses: actions/upload-artifact@v5
        with:
          name: SRK-VPN-apk
          path: SRK-VPN.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SRK VPN build ${{ github.run_number }}
          body: |
            Install SRK-VPN.apk on your Android phone.
            Free country servers from VPN Gate, OpenVPN engine by ics-openvpn (GPLv2).
          files: SRK-VPN.apk
