name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
      - "README.md"
      - ".github/workflows/collect-servers.yml"
      - "scripts/collect-servers.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_TAG: v0.7.69   # ics-openvpn release the app is built on

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig ninja-build

      - name: Get OpenVPN engine (ics-openvpn ${{ env.ENGINE_TAG }})
        run: |
          git clone --branch "$ENGINE_TAG" --depth 1 https://github.com/schwabe/ics-openvpn.git engine
          cd engine
          git submodule update --init --recursive --jobs 4

      - name: Add SRK VPN to the engine
        run: bash scripts/patch-engine.sh engine

      - name: Android SDK licences and signing key
        env:
          SRK_KEY_PASSWORD: ${{ secrets.SRK_SIGNING_PASSWORD }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          echo "sdk.dir=$SDK" > engine/local.properties
          # SRK release key (same as the other SRK apps), decrypted with the SRK_SIGNING_PASSWORD
          # secret. Passed to the engine's own "releaseOvpn2" signing config at build time.
          if [ -z "$SRK_KEY_PASSWORD" ]; then
            echo "::error::Missing secret SRK_SIGNING_PASSWORD (repo Settings > Secrets and variables > Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/srk-release.keystore.enc \
            -out "$RUNNER_TEMP/srk-release.p12" -pass env:SRK_KEY_PASSWORD

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"      # official Gradle download; engine's wrapper jars are not used
          validate-wrappers: false

      - name: Build APK
        working-directory: engine
        env:
          ORG_GRADLE_PROJECT_keystoreO2Password: ${{ secrets.SRK_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_keystoreO2AliasPassword: ${{ secrets.SRK_SIGNING_PASSWORD }}
        run: |
          gradle :main:assembleSkeletonOvpn2Release --stacktrace \
            -PkeystoreO2File="$RUNNER_TEMP/srk-release.p12" -PkeystoreO2Alias=srk

      - name: Check the signing key
        run: |
          APK=$(find engine/main/build/outputs/apk -name '*.apk' | grep -i release | head -1)
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: 3b06e91fa88c9b4f9b767781029b132e563782ab6c099d85ce00b609124e4dab" certs.txt \
            || { echo "::error::APK is not signed with the SRK release key"; exit 1; }

      - name: Collect APK
        run: |
          APK=$(find engine/main/build/outputs/apk -name '*.apk' | grep -i release | head -1)
          echo "Built: $APK"
          cp "$APK" SRK-VPN.apk
          ls -la SRK-VPN.apk

      - uses: actions/upload-artifact@v5
        with:
          name: SRK-VPN-apk
          path: SRK-VPN.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SRK VPN 1.0.${{ github.run_number }}
          body: |
            Install SRK-VPN.apk on your Android phone.
            Free country servers from VPN Gate, OpenVPN engine by ics-openvpn (GPLv2).
          files: SRK-VPN.apk
